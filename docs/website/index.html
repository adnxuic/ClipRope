  <h1 class="visually-hidden" data-i18n="pageTitle">ClipRope · Windows 11 晾衣绳式剪贴板历史管理器</h1>
  <p class="visually-hidden" data-i18n="intro">
    ClipRope 主工作区将每一次复制的文本、文件与截图挂在屏幕顶部的麻绳上。双击卡片即可粘贴回原窗口，拖下晾衣绳即可变为独立置顶悬浮便签。
  </p>

  <!-- Windows 11 File Explorer Window (Always below ClipRope main workspace & floating cards) -->

    <!-- Title Bar & Folder Tabs -->
    <header id="explorer-titlebar">
      <div id="explorer-tabs" role="tablist" aria-label="文件夹标签页" data-i18n="folderTabs:aria-label"></div>
      <div class="explorer-window-controls">
        <button type="button" id="explorer-min-btn" class="win-caption-btn" aria-label="最小化到任务栏" title="最小化" data-i18n="minimize:title minimizeToTray:aria-label">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 6h8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" id="explorer-max-btn" class="win-caption-btn" aria-label="最大化或还原窗口" title="最大化" data-i18n="maximize:title maximizeOrRestore:aria-label">
          <svg id="explorer-max-icon" viewBox="0 0 12 12" aria-hidden="true">
            <rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/>
          </svg>
        </button>
        <button type="button" id="explorer-close-btn" class="win-caption-btn win-close-btn" aria-label="关闭文件资源管理器" title="关闭" data-i18n="close:title closeExplorer:aria-label">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Address Bar -->
    <div class="explorer-navbar">
      <button id="files-copy" class="app-action" data-i18n="copySelection">复制所选</button><button id="files-paste" class="app-action" data-i18n="paste">粘贴</button>
      <div class="explorer-addressbar" id="explorer-addressbar">
        <span class="address-crumb" data-i18n="thisPC">此电脑</span>
        <span class="address-sep">›</span>
        <span class="address-crumb" data-i18n="desktop">桌面</span>
        <span class="address-sep">›</span>
        <strong class="address-current" id="explorer-current-folder-crumb">试用指南</strong>
      </div>
    </div>

    <!-- Main Body: Left Folder Switcher Sidebar + Right Files Grid -->
    <div class="explorer-body">
      <aside class="explorer-sidebar" aria-label="导航窗格" data-i18n="navigationPane:aria-label">
        <div class="sidebar-group-title" data-i18n="desktop">桌面</div>
        <div id="explorer-sidebar-list" class="sidebar-list"></div>
      </aside>

      <div class="explorer-content-wrap">
        <div class="explorer-column-header" aria-hidden="true">
          <span data-i18n="name">名称</span>
          <span data-i18n="type">类型</span>
          <span data-i18n="size">大小</span>
        </div>
        <div aria-multiselectable="true" id="explorer-files-list" class="explorer-files-list" role="listbox" aria-label="当前文件夹内容" data-i18n="folderContents:aria-label"></div>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="explorer-statusbar">
      <span id="explorer-item-count">4 个项目</span>
      <span id="explorer-focus-status" class="explorer-focus-badge">已选择 1 个项目</span>
    </footer>
  </section>

  <!-- Windows 11 WeChat-Style Desktop Chat Window (Always below ClipRope main workspace & floating cards) -->

    <!-- Left Dark Icon Rail -->
    <aside class="wechat-nav-rail" aria-hidden="true">
      <div class="wechat-my-avatar">A</div>
      <div class="wechat-rail-icon is-active">
        <svg viewBox="0 0 24 24">
          <path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.2L4.8 21l4.1-2.1c1 .2 2 .3 3.1.3 5.5 0 10-3.6 10-8.2S17.5 3 12 3z" fill="currentColor"/>
        </svg>
      </div>
      <div class="wechat-rail-icon">
        <svg viewBox="0 0 24 24">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
        </svg>
      </div>
    </aside>

    <!-- Middle Session List -->
    <aside class="wechat-session-pane" aria-label="聊天会话列表" data-i18n="chatList:aria-label">
      <div class="wechat-search-bar" aria-hidden="true">
        <div class="wechat-search-box" data-i18n="search">搜索</div>
      </div>
      <div id="wechat-sessions" class="wechat-sessions" role="listbox" aria-label="会话列表" data-i18n="conversationList:aria-label"></div>
    </aside>

    <!-- Right Main Chat Pane -->
    <div class="wechat-chat-main">
      <header id="wechat-titlebar">
        <div class="wechat-title-wrap">
          <span id="wechat-chat-title">楼下喝点啥（4）</span>
        </div>
        <div class="explorer-window-controls">
          <button type="button" id="wechat-min-btn" class="win-caption-btn" aria-label="最小化到任务栏" title="最小化" data-i18n="minimize:title minimizeToTray:aria-label">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2 6h8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" id="wechat-max-btn" class="win-caption-btn" aria-label="最大化或还原窗口" title="最大化" data-i18n="maximize:title maximizeOrRestore:aria-label">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/>
            </svg>
          </button>
          <button type="button" id="wechat-close-btn" class="win-caption-btn win-close-btn" aria-label="关闭聊天窗口" title="关闭" data-i18n="close:title closeChat:aria-label">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Message History -->
      <div id="wechat-messages" class="wechat-messages" role="log" aria-live="polite" aria-label="聊天消息记录" data-i18n="messages:aria-label"></div>

      <!-- Bottom Input Composer -->
      <div class="wechat-composer">
        <div id="wechat-draft-attachments" class="wechat-draft-attachments" hidden></div>
        <textarea
          id="wechat-input"
          class="wechat-input"
          rows="3"
          placeholder="输入消息…"
          aria-label="聊天消息输入框"
          data-i18n="composer:aria-label messagePlaceholder:placeholder"
        ></textarea>
        <div class="wechat-composer-footer">
          <button id="chat-copy" class="app-action" data-i18n="copySelectedText">复制所选文字</button><button id="chat-paste" class="app-action" data-i18n="paste">粘贴</button>
          <button type="button" id="wechat-send-btn" class="wechat-send-btn" data-i18n="send">发送(S)</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Top Hanging Rope Workspace -->
  <main id="workspace-stage" aria-label="ClipRope 主工作区" data-i18n="workspace:aria-label">
    <canvas id="workspace-canvas" aria-label="晾衣绳工作区" data-i18n="ropeWorkspace:aria-label"></canvas>
  </main>

  <!-- Desktop Floating Cards Layer (WS_EX_TOPMOST pinned notes) -->
  <div id="floating-layer" aria-label="桌面置顶悬浮卡片层" data-i18n="floatingLayer:aria-label"></div>

  <!-- Screenshot Hover Full-Size Preview Window (ClipRope.ScreenshotPreview from src/platform_win/screenshot_hover.cpp) -->
  <div id="screenshot-hover-preview" aria-hidden="true">
    <canvas id="screenshot-hover-canvas"></canvas>
  </div>

  <!-- Full-Screen Drag Overlay Canvas (prevents clipping when dragging cards between rope and desktop) -->
  <canvas id="drag-overlay-canvas" aria-hidden="true"></canvas>

  <!-- Bottom Windows 11 Taskbar (File Explorer & Snipping Tool) -->
  <footer id="win11-taskbar" aria-label="Windows 11 任务栏" data-i18n="taskbar:aria-label">
    <div class="taskbar-left" aria-hidden="true"></div>

    <nav id="taskbar-apps" aria-label="任务栏应用" data-i18n="taskbarApps:aria-label">
      <!-- Windows 11 File Explorer -->
      <button
        type="button"
        id="taskbar-explorer-btn"
        class="taskbar-app"
        data-app="explorer"
        aria-label="文件资源管理器（点击打开或切换文件夹焦点）"
        data-i18n="explorerLauncher:aria-label"
      >
        <span class="taskbar-tooltip" role="tooltip" data-i18n="explorer">文件资源管理器</span>
        <svg class="taskbar-icon" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="fe-back" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f7b529" />
              <stop offset="100%" stop-color="#d9860b" />
            </linearGradient>
            <linearGradient id="fe-front" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffde6a" />
              <stop offset="55%" stop-color="#f8c234" />
              <stop offset="100%" stop-color="#e39d14" />
            </linearGradient>
            <linearGradient id="fe-clasp" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2ea3ff" />
              <stop offset="100%" stop-color="#0067c0" />
            </linearGradient>
          </defs>
          <!-- Folder back & tab -->
          <path
            d="M3.5 7.5A2.5 2.5 0 0 1 6 5h6.4c.75 0 1.47.34 1.95.92l1.55 1.88c.28.34.7.53 1.14.53H26A2.5 2.5 0 0 1 28.5 10.8v14.7A2.5 2.5 0 0 1 26 28H6a2.5 2.5 0 0 1-2.5-2.5V7.5Z"
            fill="url(#fe-back)"
          />
          <!-- Inner paper highlight -->
          <rect x="5.5" y="9" width="21" height="6" rx="1.2" fill="#fffdf7" opacity="0.92" />
          <!-- Folder front pocket -->
          <path
            d="M3.5 12.2A2.2 2.2 0 0 1 5.7 10h8.1c.62 0 1.22-.22 1.7-.62l1.15-.96a2.2 2.2 0 0 1 1.4-.52H26.3a2.2 2.2 0 0 1 2.2 2.2v15.4A2.5 2.5 0 0 1 26 28H6a2.5 2.5 0 0 1-2.5-2.5V12.2Z"
            fill="url(#fe-front)"
          />
          <!-- Top bevel highlight on front flap -->
          <path
            d="M5.5 10.6h8.2c.65 0 1.27-.23 1.76-.64l1.1-.92c.4-.33.9-.5 1.42-.5h8.2"
            fill="none"
            stroke="#fff6c5"
            stroke-width="0.9"
            stroke-linecap="round"
            opacity="0.8"
          />
          <!-- Signature Windows 11 Blue Bottom Clasp -->
          <path
            d="M10.5 21.5h11a1.5 1.5 0 0 1 1.5 1.5v5H9v-5a1.5 1.5 0 0 1 1.5-1.5Z"
            fill="url(#fe-clasp)"
          />
          <rect x="11.5" y="23.5" width="9" height="1.8" rx="0.9" fill="#99d3ff" opacity="0.85" />
        </svg>
        <span class="taskbar-indicator" aria-hidden="true"></span>
      </button>

      <!-- Windows 11 Snipping Tool -->
      <button
        type="button"
        id="taskbar-snipping-btn"
        class="taskbar-app"
        data-app="snipping"
        aria-label="截图工具（点击框选网页截图并自动挂上晾衣绳）"
        data-i18n="snipLauncher:aria-label"
      >
        <span class="taskbar-tooltip" role="tooltip" data-i18n="snippingTool">截图工具</span>
        <svg class="taskbar-icon" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff7b54" />
              <stop offset="55%" stop-color="#ea4c27" />
              <stop offset="100%" stop-color="#c22d0f" />
            </linearGradient>
            <linearGradient id="st-blade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#dce4ec" />
            </linearGradient>
          </defs>
          <!-- Rounded app tile -->
          <rect x="3.5" y="4.5" width="25" height="23" rx="5.5" fill="url(#st-bg)" />
          <!-- Dashed selection corner inside tile -->
          <path
            d="M8.5 13V9.8c0-.72.58-1.3 1.3-1.3H13M19 8.5h3.2c.72 0 1.3.58 1.3 1.3V13M23.5 17.5v2.7c0 .72-.58 1.3-1.3 1.3H19"
            fill="none"
            stroke="#ffe8df"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-dasharray="2.4 2.4"
          />

  <!-- Windows 11 Snipping Tool Overlay (Win + Shift + S style) -->
  <div id="win11-snip-overlay" aria-hidden="true">
    <canvas id="snip-overlay-canvas"></canvas>

    <div id="snip-toolbar" role="toolbar" aria-label="Windows 11 截图工具栏" data-i18n="snipToolbar:aria-label">
      <button
        type="button"
        id="snip-mode-rect"
        class="snip-tool-btn is-selected"
        aria-label="矩形截图模式"
        aria-pressed="true"
        title="矩形模式（拖拽框选截图区域）"
        data-i18n="rectangleTip:title rectangle:aria-label"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M3.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2M13 3.5h2A1.5 1.5 0 0 1 16.5 5v2M16.5 13v2a1.5 1.5 0 0 1-1.5 1.5h-2M7 16.5H5A1.5 1.5 0 0 1 3.5 15v-2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <path
            d="M9.2 3.5h1.6M16.5 9.2v1.6M9.2 16.5h1.6M3.5 9.2v1.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
        <span class="snip-indicator" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        id="snip-mode-fullscreen"
        class="snip-tool-btn"
        aria-label="全屏截图"
        title="全屏模式（立即截取整个网页并挂入绳子）"
        data-i18n="fullScreenTip:title fullScreen:aria-label"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <rect
            x="2.8"
            y="4"
            width="14.4"
            height="12"
            rx="1.8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
          />
          <path
            d="M5.5 7.8V6.3h1.5M14.5 7.8V6.3H13M5.5 12.2v1.5h1.5M14.5 12.2v1.5H13"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <span class="snip-divider" aria-hidden="true"></span>

      <button
        type="button"
        id="snip-close-btn"
        class="snip-tool-btn snip-close"
        aria-label="关闭截图工具"
        title="关闭 (Esc)"
        data-i18n="closeEsc:title closeSnip:aria-label"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M5.5 5.5 14.5 14.5M14.5 5.5 5.5 14.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </div>
